name: Swift Linux build supported versions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, next ]

# Builds and tests on the older Swift minors inside the support window (the three most
# recent minor releases). The newest minor is covered by the regular Linux build workflow.
jobs:
  build-linux-supported:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2", "6.3"]

    runs-on: ubuntu-latest
    container:
      image: swift:${{ matrix.swift }}

    steps:
    - uses: actions/checkout@v6

    - name: Ubuntu deps
      run: |
        apt-get update && apt-get install -y libjemalloc-dev

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build

    - name: Run tests
      run: |
        if [ -d Tests ]; then
          swift test --parallel
        fi
