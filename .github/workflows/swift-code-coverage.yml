name: Swift code coverage

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, next ]
permissions:
  contents: read

jobs:
  test-code-coverage:
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - name: Install deps
      run: |
        apt-get update -q && apt-get install -y -q libjemalloc-dev curl

    - name: Swift version
      run: swift --version

    - name: Run tests
      continue-on-error: true
      run: |
        [ -d Tests ] && swift test --parallel --enable-code-coverage

    - name: Export code coverage
      run: |
        [ -d Tests ] || exit 0
        # Paths from SwiftPM: native builds one <Package>PackageTests.xctest, swiftbuild one <Target>.so per test target.
        bin=$(swift build --show-bin-path)
        profdata="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
        objects=""
        for f in $(find -L "$bin" -maxdepth 1 -type f \( -name '*PackageTests.xctest' -o -name '*.so' \)); do
          objects="$objects ${objects:+-object }$f"
        done
        [ -n "$objects" ] || { echo "no test binaries in $bin"; exit 1; }
        echo "llvm-cov export$objects"
        llvm-cov export -format=lcov $objects -instr-profile "$profdata" > info.lcov

    - name: Upload codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_REPO_TOKEN }}
        files: info.lcov
        fail_ci_if_error: true
